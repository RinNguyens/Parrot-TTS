[project]
name = "parrot-tts"
version = "0.1.0"
description = "Parrot-TTS: Vietnamese text-to-speech for Vietnamese speakers"
authors = [
    { name = "RinNguyens" }
]
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
dependencies = [
    "numpy>=1.26.4",
    "pydantic>=2.14.3",
    "pyloudnorm>=0.2.0",
    "pyyaml>=6.0.3",
    "soundfile>=0.14.0",
]

[project.optional-dependencies]
# Để đọc trên máy mình (`parrot-tts tts`): phần CosyVoice cần lúc suy luận, theo requirements.txt của CosyVoice ở commit
# đang dùng, bỏ phần train/phục vụ (deepspeed, tensorrt, gradio, grpc, tensorboard). torch 2.3.1 cần numpy 1.x.
tts = [
    "torch==2.3.1",
    "torchaudio==2.3.1",
    "numpy<2",
    "huggingface_hub[hf_xet]>=0.34,<1.0",
    "transformers==4.51.3",
    "onnxruntime==1.18.0",
    "HyperPyYAML==1.2.3",
    "modelscope==1.20.0",
    "openai-whisper>=20240930",
    "conformer==0.3.2",
    "diffusers==0.29.0",
    "x-transformers==2.11.24",
    "lightning==2.2.4",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "librosa==0.10.2",
    "inflect==7.3.1",
    "pyworld>=0.3.4",
    "pyarrow==18.1.0",
    "matplotlib>=3.7.5",
    "rich>=13.7.1",
    "gdown>=5.1.0",
    "wget==3.2",
    "tqdm",
    "setuptools<70",  # lightning 2.2 còn gọi pkg_resources, setuptools mới đã bỏ
]

[project.scripts]
parrot-tts = "parrot_tts:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.170.15",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
# Vẽ biểu đồ cho luận văn (eval/plots.py). Không vào bản sản phẩm.
viz = [
    "matplotlib>=3.11.2",
    "pandas>=3.1.1",
    "seaborn>=0.13.2",
]

[tool.uv]
default-groups = ["dev", "viz"]
# nhóm viz (pandas, matplotlib mới) cần numpy 2; phần đọc local cần numpy 1.x: không cài chung một môi trường
conflicts = [[{ extra = "tts" }, { group = "viz" }]]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["parrot_tts"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
