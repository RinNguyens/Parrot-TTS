# Luật G2P giọng Nam (Sài Gòn). Chủ dự án viết và duyệt file này.
# Code (text/g2p.py) chỉ tách chữ viết thành âm đầu / vần / thanh; mọi cách đọc nằm ở đây.
# Nguồn: doc "VietVoice – Đặc tả kỹ thuật TTS", mục 2 và mục 3.
# Dòng có "NHÁP" là Claude điền tạm, chờ chủ dự án duyệt.

# Âm đầu: chữ viết -> âm vị. "" là âm tiết mở đầu bằng nguyên âm (sẽ có ʔ).
onset:
  "": ""
  b: ɓ
  c: k
  k: k
  ch: c
  d: j        # d -> j (Nam)
  gi: j       # gi -> j (Nam)
  r: ɹ        # NHÁP, CHƯA CHỐT: đặc tả ghi ɹ/ɾ
  đ: ɗ        # NHÁP
  g: ɣ        # NHÁP
  gh: ɣ       # NHÁP
  h: h
  kh: x       # NHÁP
  l: l
  m: m
  n: n
  ng: ŋ
  ngh: ŋ
  nh: ɲ
  p: p
  ph: f
  s: ʂ        # s giữ quặt lưỡi (Nam)
  t: t
  th: tʰ      # NHÁP
  tr: ʈ       # tr giữ quặt lưỡi (Nam)
  v: v        # NHÁP, CHƯA CHỐT: đặc tả ghi "j hoặc v"
  x: s

# qu -> w (Nam)
qu:
  onset: ""
  glide: w

# Âm chính: nguyên âm chữ viết -> âm vị.
# ia, yê -> iê ; ưa -> ươ ; ua -> uô (code gộp sẵn trước khi tra bảng).
nucleus:
  a: a
  ă: a        # NHÁP: xem ghi chú ở bac.yaml
  â: ə̆        # NHÁP
  e: ɛ
  ê: e
  i: i
  o: ɔ
  oo: ɔ
  ô: o
  ơ: ə
  u: u
  ư: ɨ
  iê: iə
  uô: uə
  ươ: ɨə

# Âm cuối: chữ viết -> âm vị.
coda:
  "": ""
  c: k
  ch: t      # -ach -> at (Nam)
  m: m
  n: n
  ng: ŋ
  nh: n      # -anh -> an (Nam)
  p: p
  t: t
  i: j
  u: w

# Luật âm cuối theo nguyên âm đứng trước (chữ viết). Dòng đầu tiên khớp được dùng.
# Chưa có luật cho -in, -inh, -ên, -ênh, -un... giọng Nam: chờ chủ dự án.
coda_rules:
  - {coda: c, after: [o, ô], to: k͡p}        # -oc, -ôc khép môi
  - {coda: ng, after: [o, ô], to: ŋ͡m}       # -ong, -ông khép môi
  - {coda: n, after: [a, ă, â], to: ŋ}       # -n sau a/ă/â -> ŋ (Nam)
  - {coda: t, after: [a, ă, â], to: k}       # -t sau a/ă/â -> k (Nam)

# Thanh: ngã nhập hỏi (Nam), nên không bao giờ có T3.
tone:
  3: 4
